<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050810">
<title>Tramuntana — Nocturn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050810;
    --charcoal:#131a26;
    --line:#212c3c;
    --green:#2bb7a0;
    --orange:#d9b872;
    --red:#e3483c;
    --silver-hi:#eef1f4;
    --silver-lo:#5b6570;
    --text:#e8ecf3;
    --text-dim:#8791a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100svh;
    background:
      radial-gradient(ellipse at 50% -10%, #0d1a2c 0%, #05080f 55%, #02040a 100%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .stage{
    width:100%;
    max-width:760px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }
  .brandline{
    text-align:center;
    color:var(--text-dim);
    font-family:'Oswald',sans-serif;
    letter-spacing:.35em;
    font-size:11px;
    text-transform:uppercase;
    margin-top:2px;
  }
  .brandline b{color:var(--orange); font-weight:600;}

  /* ---------- watch row ---------- */
  .watch-row{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:22px;
  }
  .dial-wrap{
    flex:0 0 auto;
    width:clamp(250px, 58vw, 430px);
    aspect-ratio:1/1;
    filter: drop-shadow(0 18px 34px rgba(0,0,0,.55));
  }
  .dial-wrap svg{width:100%; height:100%; display:block;}

  .stats{
    flex:0 0 auto;
    width:clamp(150px, 24vw, 200px);
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .stat-card{
    background:linear-gradient(180deg,var(--charcoal),#101213);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px 16px;
    text-align:center;
  }
  .stat-card svg.icon{width:26px; height:26px; display:block; margin:0 auto 6px;}
  .stat-label{
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .stat-value{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    color:var(--orange);
    font-size:clamp(20px,4.4vw,26px);
    line-height:1;
  }
  .stat-value sup{font-size:.5em; font-weight:500; margin-left:1px;}
  .stat-unit{
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    color:var(--orange);
    font-size:clamp(16px,3.6vw,20px);
  }
  .stat-sub{
    margin-top:5px;
    font-size:10.5px;
    color:var(--text-dim);
  }

  @media (max-width:640px){
    .watch-row{flex-direction:column; align-items:center;}
    .dial-wrap{width:min(84vw,380px);}
    .stats{
      width:100%;
      max-width:380px;
      flex-direction:row;
    }
    .stat-card{flex:1;}
  }

  /* Landscape (phones and tablets rotated): size the dial off the
     viewport HEIGHT, not width, so a wide-but-short screen never
     forces the dial to grow past the available vertical space. */
  @media (orientation:landscape){
    .stage{
      flex-direction:row;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:center;
      gap:24px;
      max-width:1040px;
    }
    .watch-row{
      flex:0 1 auto;
      width:auto;
    }
    .dial-wrap{
      width:clamp(190px, 36vh, 380px);
    }
    .stats{
      width:clamp(120px, 16vh, 180px);
      flex-direction:column;
    }
    .cal-card{
      flex:1 1 320px;
      max-width:400px;
      margin-top:0;
      align-self:center;
    }
  }
  @media (orientation:landscape) and (max-width:680px){
    /* narrow phones rotated: not enough width for two columns,
       fall back to a compact stacked layout instead */
    .stage{flex-direction:column; align-items:center;}
    .watch-row{flex-direction:row;}
    .dial-wrap{width:clamp(170px, 44vh, 300px);}
    .cal-card{max-width:520px;}
  }

  /* ---------- calendar ---------- */
  .cal-card{
    width:100%;
    max-width:620px;
    background:linear-gradient(180deg,var(--charcoal),#0e1010);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 14px 14px;
  }
  .cal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:2px 6px 10px;
  }
  .cal-nav{
    width:30px; height:30px;
    border:none;
    background:transparent;
    color:var(--green);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    border-radius:8px;
  }
  .cal-nav:hover{background:rgba(43,183,160,.12);}
  .cal-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--orange);
    font-size:clamp(16px,3.6vw,20px);
  }
  .cal-weekdays,.cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
  }
  .cal-weekdays div{
    text-align:center;
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--text-dim);
    padding-bottom:8px;
    font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .cal-grid{row-gap:6px;}
  .day{
    position:relative;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(13px,3vw,15px);
    color:var(--text);
    padding:6px 0;
  }
  .day.dim{color:#3b3f3c;}
  .day.mon{color:var(--orange); font-weight:700;}
  .day.today span{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px; height:24px;
    border:1.5px solid var(--red);
    border-radius:50%;
    color:var(--red);
    font-weight:700;
  }
  .cal-foot{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    text-align:center;
    font-size:12.5px;
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
  }
  .cal-foot b{color:var(--orange); font-weight:600;}

  footer.credit{
    color:#4c504b;
    font-size:10px;
    letter-spacing:.08em;
    text-align:center;
    padding:4px 0 2px;
  }
</style>
</head>
<body>
<div class="stage">

  <div class="watch-row">
    <div class="dial-wrap">
      <svg viewBox="0 0 400 400">
        <defs>
          <radialGradient id="caseGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#3c4a63"/>
            <stop offset="55%" stop-color="#182130"/>
            <stop offset="100%" stop-color="#070a10"/>
          </radialGradient>
          <radialGradient id="dialGrad" cx="50%" cy="42%" r="65%">
            <stop offset="0%" stop-color="#0e2038"/>
            <stop offset="75%" stop-color="#060c17"/>
            <stop offset="100%" stop-color="#020303"/>
          </radialGradient>
          <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#eef2f6"/>
            <stop offset="45%" stop-color="#aebac6"/>
            <stop offset="100%" stop-color="#525d6b"/>
          </linearGradient>
          <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f6ecd2"/>
            <stop offset="50%" stop-color="#d9b872"/>
            <stop offset="100%" stop-color="#8a6f3c"/>
          </linearGradient>
        </defs>

        <circle cx="200" cy="200" r="198" fill="url(#caseGrad)"/>
        <circle cx="200" cy="200" r="192" fill="none" stroke="#000" stroke-width="3" opacity=".6"/>
        <circle cx="200" cy="200" r="182" fill="url(#dialGrad)"/>
        <circle cx="200" cy="200" r="178" fill="none" stroke="#233047" stroke-width="1"/>

        <g opacity="0.16" stroke="#2bb7a0" stroke-width="1" fill="none">
          <path d="M74.4,127.5 A145,145 0 0,1 293.2,88.9"/>
          <path d="M126.1,111.9 A115,115 0 0,1 313.3,180.0"/>
          <path d="M169.9,117.3 A88,88 0 0,1 286.7,215.3"/>
        </g>

        <g id="ticks"></g>
        <g id="batons"></g>

        <text x="200" y="76" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="46" fill="#d9b872">12</text>
        <text x="328" y="213" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="38" fill="#d9b872">3</text>
        <text x="200" y="349" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="46" fill="#d9b872">6</text>
        <text x="72" y="213" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="38" fill="#d9b872">9</text>

        <text x="200" y="150" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="500" font-size="15" letter-spacing="3" fill="#e6e9ee">TRAMUNTANA</text>
        <text x="200" y="243" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="10" letter-spacing="2.6" fill="#8791a3">NOCTURN · AUTOMATIC</text>

        <g stroke="#d9b872" stroke-width="1">
          <polygon points="200,258 203,270 200,274 197,270" fill="#d9b872"/>
          <polygon points="200,258 203,270 200,274 197,270" fill="none" transform="rotate(90 200 270)"/>
          <polygon points="200,258 203,270 200,274 197,270" fill="none" transform="rotate(180 200 270)"/>
          <polygon points="200,258 203,270 200,274 197,270" fill="none" transform="rotate(270 200 270)"/>
          <circle cx="200" cy="270" r="1.5" fill="#d9b872" stroke="none"/>
        </g>

        <g id="hourHand">
          <polygon points="0,-86 6,-64 6,22 -6,22 -6,-64" fill="url(#handGrad)" stroke="#2a2412" stroke-width="1"/>
        </g>
        <g id="minHand">
          <polygon points="0,-128 5,-98 5,22 -5,22 -5,-98" fill="url(#handGrad)" stroke="#2a2412" stroke-width="1"/>
        </g>
        <g id="secHand">
          <line x1="0" y1="26" x2="0" y2="-148" stroke="#e3483c" stroke-width="2"/>
          <circle cx="0" cy="-118" r="6" fill="#e3483c"/>
          <circle cx="2.6" cy="-119.6" r="5.1" fill="#0a1220"/>
          <circle cx="0" cy="30" r="6" fill="#e3483c" stroke="#1a1a1a" stroke-width="1"/>
        </g>

        <circle cx="200" cy="200" r="10" fill="#d9b872" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="200" cy="200" r="3.5" fill="#1a1a1a"/>
      </svg>
    </div>

    <div class="stats">
      <div class="stat-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#2bb7a0" stroke-width="1.6"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="stat-label">Temperatura</div>
        <div class="stat-value" id="tempVal">–<span class="stat-unit">°c</span></div>
        <div class="stat-sub" id="tempLabel">Exterior</div>
      </div>
      <div class="stat-card">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#2bb7a0" stroke-width="1.6"><path d="M3 20l6-11 4 6 3-5 5 10H3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="stat-label">Altitud</div>
        <div class="stat-value" id="altVal">– <span class="stat-unit">m</span></div>
        <div class="stat-sub">Sobre el nivell del mar</div>
      </div>
    </div>
  </div>

  <div class="cal-card">
    <div class="cal-head">
      <button class="cal-nav" id="prevMonth">‹</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="cal-nav" id="nextMonth">›</button>
    </div>
    <div class="cal-weekdays">
      <div>DIL</div><div>DIM</div><div>DIM</div><div>DIJ</div><div>DIV</div><div>DIS</div><div>DIU</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot" id="calFoot">—</div>
  </div>

  <footer class="credit">TRAMUNTANA · NOCTURN AUTOMATIC · disseny original</footer>
</div>

<script>
/* ---------------- rellotge ---------------- */
const svgNS = "http://www.w3.org/2000/svg";
function polar(cx,cy,r,angleDeg){
  const a = (angleDeg-90) * Math.PI/180;
  return {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
}
const ticksG = document.getElementById('ticks');
const batonsG = document.getElementById('batons');
const cardinalSet = new Set([0,90,180,270]);

for(let i=0;i<60;i++){
  const angle = i*6;
  if(angle % 30 === 0) continue; // hour positions handled separately
  const p1 = polar(200,200,169,angle);
  const p2 = polar(200,200,180,angle);
  const l = document.createElementNS(svgNS,'line');
  l.setAttribute('x1',p1.x); l.setAttribute('y1',p1.y);
  l.setAttribute('x2',p2.x); l.setAttribute('y2',p2.y);
  l.setAttribute('stroke','#2bb7a0');
  l.setAttribute('stroke-width','1.6');
  l.setAttribute('stroke-linecap','round');
  ticksG.appendChild(l);
}
for(let h=0;h<12;h++){
  const angle = h*30;
  if(cardinalSet.has(angle)) continue; // numerals live here instead
  const p = polar(200,200,158,angle);
  const rect = document.createElementNS(svgNS,'rect');
  rect.setAttribute('x',-4.5); rect.setAttribute('y',-13);
  rect.setAttribute('width',9); rect.setAttribute('height',26);
  rect.setAttribute('rx',1.4);
  rect.setAttribute('fill','url(#silverGrad)');
  rect.setAttribute('stroke','#1c1e1c');
  rect.setAttribute('stroke-width','0.6');
  rect.setAttribute('transform',`translate(${p.x},${p.y}) rotate(${angle})`);
  batonsG.appendChild(rect);
}

const hourHand = document.getElementById('hourHand');
const minHand = document.getElementById('minHand');
const secHand = document.getElementById('secHand');

function tickClock(){
  const now = new Date();
  const ms = now.getMilliseconds();
  const s = now.getSeconds() + ms/1000;
  const m = now.getMinutes() + s/60;
  const h = (now.getHours()%12) + m/60;
  secHand.setAttribute('transform', `translate(200,200) rotate(${s*6})`);
  minHand.setAttribute('transform', `translate(200,200) rotate(${m*6})`);
  hourHand.setAttribute('transform', `translate(200,200) rotate(${h*30})`);
  requestAnimationFrame(tickClock);
}
requestAnimationFrame(tickClock);

/* ---------------- calendari ---------------- */
const monthsCA = ['GENER','FEBRER','MARÇ','ABRIL','MAIG','JUNY','JULIOL','AGOST','SETEMBRE','OCTUBRE','NOVEMBRE','DESEMBRE'];
const weekdaysFullCA = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
let viewDate = new Date();
viewDate.setDate(1);

function renderCalendar(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  document.getElementById('calTitle').textContent = `${monthsCA[month]} ${year}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const startOffset = (new Date(year,month,1).getDay()+6)%7; // dilluns=0
  const daysInMonth = new Date(year,month+1,0).getDate();
  const daysInPrev = new Date(year,month,0).getDate();
  const today = new Date();

  const addCell = (dayNum, faded, isMonday, isToday) => {
    const cell = document.createElement('div');
    cell.className = 'day' + (faded?' dim':'') + (isMonday && !faded ? ' mon':'') + (isToday?' today':'');
    if(isToday){
      const span = document.createElement('span');
      span.textContent = dayNum;
      cell.appendChild(span);
    } else {
      cell.textContent = dayNum;
    }
    grid.appendChild(cell);
  };

  for(let i=startOffset;i>0;i--){
    addCell(daysInPrev-i+1, true, false, false);
  }
  for(let d=1; d<=daysInMonth; d++){
    const isMonday = ((startOffset + d - 1) % 7) === 0;
    const isToday = d===today.getDate() && month===today.getMonth() && year===today.getFullYear();
    addCell(d, false, isMonday, isToday);
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let d=1; d<=trailing; d++){
    addCell(d, true, false, false);
  }

  const wd = weekdaysFullCA[today.getDay()];
  const wdCap = wd.charAt(0).toUpperCase()+wd.slice(1);
  document.getElementById('calFoot').innerHTML =
    `${wdCap}, <b>${today.getDate()}</b> de ${monthsCA[today.getMonth()].toLowerCase()} de ${today.getFullYear()}`;
}
renderCalendar();

document.getElementById('prevMonth').addEventListener('click',()=>{
  viewDate.setMonth(viewDate.getMonth()-1);
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click',()=>{
  viewDate.setMonth(viewDate.getMonth()+1);
  renderCalendar();
});

/* ---------------- temperatura i altitud (Open-Meteo) ---------------- */
async function loadEnvironment(){
  const tempLabel = document.getElementById('tempLabel');
  if(!('geolocation' in navigator)){
    tempLabel.textContent = 'Sense geolocalització';
    return;
  }
  navigator.geolocation.getCurrentPosition(async (pos)=>{
    const { latitude, longitude } = pos.coords;
    try{
      const [wRes, eRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m`),
        fetch(`https://api.open-meteo.com/v1/elevation?latitude=${latitude}&longitude=${longitude}`)
      ]);
      const wData = await wRes.json();
      const eData = await eRes.json();
      const t = wData.current.temperature_2m;
      document.getElementById('tempVal').innerHTML = `${t.toFixed(1)}<span class="stat-unit">°c</span>`;
      const alt = Math.round(eData.elevation[0]);
      document.getElementById('altVal').innerHTML = `${alt} <span class="stat-unit">m</span>`;
      tempLabel.textContent = 'Exterior';
    }catch(err){
      tempLabel.textContent = 'Dades no disponibles';
    }
  }, ()=>{
    tempLabel.textContent = 'Ubicació denegada';
  }, { timeout: 8000 });
}
loadEnvironment();
setInterval(loadEnvironment, 10*60*1000);
</script>
</body>
</html>
